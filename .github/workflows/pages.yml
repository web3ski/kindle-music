name: Build KPM repo and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell hooks
        run: |
          for f in package/*.sh tools/*.sh plugin/scriptlet/*.sh; do sh -n "$f"; done
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          for f in plugin/kindlemusic.koplugin/*.lua; do luajit -bl "$f" > /dev/null; done
      - name: Build package and repository
        run: tools/build_repo.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
