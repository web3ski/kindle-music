<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Kindle Music: Spotify sign-in</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; font-size: 18px; line-height: 1.45; margin: 0 auto; padding: 24px 18px; max-width: 520px; color: #111; background: #fff; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .btn { display: block; margin-top: 16px; padding: 14px; font-size: 17px; font-weight: 600; border-radius: 10px; background: #1db954; color: #000; text-align: center; text-decoration: none; }
  small { color: #555; }
</style>
</head>
<body>
<h1 id="title">Back to your Kindle…</h1>
<p id="msg">Handing the sign-in over to your Kindle on your home Wi-Fi.</p>
<p id="link" hidden><a class="btn" id="go" href="#">Continue to the Kindle</a></p>
<p><small>This page only passes Spotify's one-time code to your Kindle. It does not store anything,
and the code is useless without a secret key that never leaves the Kindle.</small></p>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var state = params.get('state') || '';
  var target = null;
  try {
    var s = state.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) { s += '='; }
    target = JSON.parse(atob(s)).r;
  } catch (e) {}
  // only ever forward to a Kindle on a private home network address
  var ok = typeof target === 'string' &&
    /^http:\/\/(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}(\.\d{1,3})?:8888\/[A-Za-z0-9_-]{4,32}\/cb$/.test(target);
  if (!ok) {
    document.getElementById('title').textContent = 'Something went wrong';
    document.getElementById('msg').textContent = 'This page is opened by Spotify after you sign in from the Kindle Music QR code. Start again from the Kindle.';
    return;
  }
  var url = target + '?' + params.toString();
  document.getElementById('go').href = url;
  document.getElementById('link').hidden = false;
  history.replaceState(null, '', location.pathname); // don't keep the code in the history
  location.replace(url);
})();
</script>
</body>
</html>
